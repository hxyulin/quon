[env]
# Quon's tests compile quon.rs scripts, which link against a
# quon-config library that Quon builds once into $QUON_HOME. Point
# every process cargo starts (tests, and `cargo run`) at the checkout's
# `target/` so they never write into the user's ~/.quon. An explicit
# QUON_HOME in the environment still wins.
QUON_HOME = { value = "target/quon-home", relative = true }
