[package]
name = "gluon-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core library for the Gluon build system: build model, scheduler, compile/cache/vendor primitives."
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
gluon-model.workspace = true
# Not used by gluon-core's code: gluon-core never `use`s gluon_config.
# Listed so that `cargo install gluon-cli` downloads gluon-config's
# sources (and its dependencies') into cargo's cache. An installed gluon
# then builds the library that gluon.rs links against with `cargo build
# --offline` (see `script_runner::rlib`). The `rust-project.json` that
# `gluon configure` writes also points rust-analyzer at those sources.
gluon-config.workspace = true
fs2 = "0.4"
# In-process FAT12/16/32 formatter + writer. Used by the `image()`
# scheduler node to assemble bootable disk images from compiled
# artifacts without shelling out to mtools / mkfs.fat. Synchronous,
# `no_std`-compatible upstream but we use the `std` paths.
# Pinned to 1.x; the API has stabilised since 1.0.
hadris-fat = "1.1"
# `rc` serialises the `Arc`s in `NodeData`, which fingerprint records store.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
toml = "0.8"
walkdir = "2"
# Parses `[target.'cfg(...)'.dependencies]` keys and matches them
# against `rustc --print cfg` output. Published by the Cargo team; it is
# the matcher Cargo itself uses, so Gluon selects the same edges.
cargo-platform = "0.3.0"
semver = "1"
glob = "0.3"

# Signal handling for `gluon run`: catches SIGINT/SIGTERM so the
# spawned QEMU child can be killed cleanly instead of wedging. Used
# only by the runner (`run::entry`); the rest of gluon-core does not
# touch signals. Scoped to Unix because the runner's signal trapping
# is a no-op on Windows (console Ctrl+C handling is a different
# mechanism and the runner is Unix-centric today).
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[features]
# Enables tests that touch the network (e.g. `cargo vendor` pulling from
# crates.io). Off by default so `cargo test` works offline; CI turns this
# on in a dedicated job. See `tests/vendor_e2e.rs`.
network-tests = []

[dev-dependencies]
tempfile = "3"
# Scoped, safe wrapper for env var mutation in tests. Uses a global
# mutex internally so the unsafe `std::env::set_var` (Rust 1.80+) is
# isolated to one place. Keeps our test code free of `unsafe` blocks
# that would otherwise need per-call SAFETY justifications.
temp-env = "0.3"
# Used in objcopy tests to locate `rustc` on PATH so we can derive a
# probe path without hard-coding a toolchain install location.
which = "7"
