[package]
name = "gluon-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line interface for the Gluon build system."
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "gluon"
path = "src/main.rs"

[dependencies]
gluon-core.workspace = true
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# Used only by `gluon internal dump-dsl` to emit a stable JSON wrapper
# around the DSL signature list. Already in the workspace dep tree via
# `gluon-core`, so this is a zero-cost addition.
serde_json = "1"
# `gluon init` reads `.cargo/config.toml` and `rust-toolchain.toml`.
toml = "0.8"

[dev-dependencies]
tempfile = "3"
