[workspace]
resolver = "3"
members = [
    "crates/quon-model",
    "crates/quon-core",
    "crates/quon",
    "crates/quon-config",
    "crates/quon-runner",
    "crates/quon-runner-qemu",
]
default-members = ["crates/quon"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hxyulin/quon"
rust-version = "1.99"
keywords = ["build-system", "cargo", "rustc", "bare-metal", "kernel"]
categories = ["development-tools::build-utils", "embedded"]

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.dependencies]
quon-config = { path = "crates/quon-config" }
quon-core = { path = "crates/quon-core" }
quon-model = { path = "crates/quon-model" }
quon-runner = { path = "crates/quon-runner" }
quon-runner-qemu = { path = "crates/quon-runner-qemu" }
