[workspace]
resolver = "3"
members = [
    "crates/gluon-model",
    "crates/gluon-core",
    "crates/gluon-cli",
    "crates/gluon-config",
]
default-members = ["crates/gluon-cli"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hxyulin/gluon"
rust-version = "1.99"
keywords = ["build-system", "cargo", "rustc", "bare-metal", "kernel"]
categories = ["development-tools::build-utils", "embedded"]

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.dependencies]
gluon-config = { path = "crates/gluon-config" }
gluon-core = { path = "crates/gluon-core" }
gluon-model = { path = "crates/gluon-model" }
